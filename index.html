<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лабиринт</title>
<style>
  @font-face {
    font-family: 'Russo One'; font-display: block;
    src: url(fonts/russo-one-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Russo One'; font-display: block;
    src: url(fonts/russo-one-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  html, body { margin: 0; height: 100%; background: #070a1f; overflow: hidden; }
  canvas { display: block; }
  #boot-error { position: fixed; inset: 10% 5% auto; margin: 0; color: #fff; font: bold 3.5vh system-ui, sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="boot-error" hidden></pre>
<!-- If any module fails to load, say so on screen: on the TV nobody looks at the console. -->
<script type="module">
  import('./js/main.js').catch(error => {
    console.error(error);
    const box = document.getElementById('boot-error');
    box.textContent = `Ошибка: игра не загрузилась. Попробуй обновить страницу.\n${error.message}`;
    box.hidden = false;
  });
</script>
</body>
</html>
