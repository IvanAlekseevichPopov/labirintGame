<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лабиринт</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a1f; overflow: hidden; }
  canvas { display: block; }
  #boot-error { position: fixed; inset: 10% 5% auto; margin: 0; color: #fff; font: bold 3.5vh system-ui, sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="boot-error" hidden></pre>
<!-- If any module fails to load, say so on screen: on the TV nobody looks at the console. -->
<script type="module">
  import('./js/main.js').catch(error => {
    console.error(error);
    const box = document.getElementById('boot-error');
    box.textContent = `Ошибка: игра не загрузилась. Попробуй обновить страницу.\n${error.message}`;
    box.hidden = false;
  });
</script>
</body>
</html>
