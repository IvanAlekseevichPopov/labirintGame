<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лабиринт</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a1f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="level-format.js"></script>
<script src="levels.js"></script>
<script>
// Holding a direction: first step at once, next after FIRST_REPEAT_MS, then every step interval.
const FIRST_REPEAT_MS = 300;
// Step interval scales with cell size so on-screen speed stays similar across levels.
const MIN_STEP_MS = 150;
const MAX_STEP_MS = 220;
const TURN_BUFFER_MS = 500;
const INPUT_LOCK_MS = 400;
const BUMP_MS = 140;
const WALL_RATIO = 0.26;
const ROVER_RATIO = 0.78;
const OUTLINE = '#1c1e26';

// Timeline of the win sequence, ms since reaching the rocket.
const WIN = { shrinkStart: 150, shrinkMs: 400, ignite: 600, lift: 1000, liftMs: 1400, next: 2600 };

const DIRS = {
  up:    { dx: 0,  dy: -1, wall: 'top',    angle: -Math.PI / 2 },
  down:  { dx: 0,  dy: 1,  wall: 'bottom', angle: Math.PI / 2 },
  left:  { dx: -1, dy: 0,  wall: 'left',   angle: Math.PI },
  right: { dx: 1,  dy: 0,  wall: 'right',  angle: 0 },
};
const KEY_TO_DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
const RESTART_KEYS = ['r', 'R', 'к', 'К'];
// Cheap pads (mapping "") report the d-pad as axes 0/1; standard-mapped pads as buttons 12–15.
const PAD_PRESS = 0.5;
const PAD_RELEASE = 0.3;
const PAD_STANDARD_DPAD = { 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
const PAD_RESTART_BUTTON = 8;

const PLANETS = {
  moon: {
    name: 'Луна', drawRover: drawLunokhod,
    floor: '#80838f', speck: '#90939e', crater: '#696c77', craterRim: '#a3a6b1', track: '#5f626d',
    wallBase: '#3a3c45', wallTop: '#b9bcc7',
  },
  mars: {
    name: 'Марс', drawRover: drawMarsRover,
    floor: '#b5532c', speck: '#c2623a', crater: '#933f1e', craterRim: '#d98457', track: '#8a3a1a',
    wallBase: '#56200e', wallTop: '#e28b5e',
  },
  europa: {
    name: 'Европа', drawRover: drawIcebreaker,
    floor: '#cfe2ec', speck: '#e3f0f6', crater: '#b4cddb', craterRim: '#f1f8fb', track: '#a6c0cf',
    wallBase: '#557f9e', wallTop: '#f4fbff', cracks: '#b8774c',
  },
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mazeLayer = document.createElement('canvas');
const trackLayer = document.createElement('canvas');
let stars = [];

// Seeded so a level's decorations look the same every time — part of what makes it recognisable.
function mulberry32(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function scatter(rand, count, cols, rows, minR, maxR) {
  return Array.from({ length: Math.round(count) }, () => ({
    x: rand() * cols,
    y: rand() * rows,
    r: minR + rand() * (maxR - minR),
  }));
}

// Europa's long reddish surface fractures: gently wandering polylines in cell units.
function makeCracks(rand, count, cols, rows) {
  return Array.from({ length: count }, () => {
    let x = rand() * cols, y = rand() * rows, angle = rand() * Math.PI * 2;
    const points = [[x, y]];
    for (let i = 0; i < 5; i++) {
      angle += (rand() - 0.5) * 0.8;
      x += Math.cos(angle) * (0.6 + rand() * 0.5);
      y += Math.sin(angle) * (0.6 + rand() * 0.5);
      points.push([x, y]);
    }
    return points;
  });
}

const state = {};

function startLevel(index) {
  index %= LEVELS.length;
  const { planet, maze, start, goal, landmarks, startDir } = parseLevel(LEVELS[index], index + 1, Object.keys(PLANETS));
  const { cols, rows } = maze;
  const rand = mulberry32(index + 1);
  const facing = Object.values(DIRS).find(d => d.wall === startDir);
  Object.assign(state, {
    index,
    planet: PLANETS[planet],
    maze,
    goal,
    landmarks,
    player: { ...start },
    from: { ...start },
    moveStart: -Infinity,
    moveMs: MIN_STEP_MS,
    nextMoveAt: 0,
    blocked: false,
    bump: null,
    angle: facing.angle,
    targetAngle: facing.angle,
    wonAt: null,
    inputFrom: performance.now() + INPUT_LOCK_MS,
    craters: scatter(rand, cols * rows * 0.5, cols, rows, 0.05, 0.15),
    specks: scatter(rand, cols * rows * 6, cols, rows, 0.01, 0.035),
    cracks: makeCracks(rand, Math.ceil(cols * rows / 12), cols, rows),
    tracks: [],
    trackKeys: new Set(),
    pendingTrack: null,
  });
  resetInput();
  buildMazeLayer();
  buildTrackLayer();
}

// Directions in press order; `fresh` is a press made with nothing else held (moves at once,
// even if released before the next frame); `buffered` remembers a turn asked for slightly
// before the corridor opens.
const input = { held: [], fresh: null, buffered: null };

function resetInput() {
  input.held.length = 0;
  input.fresh = null;
  input.buffered = null;
}

function press(dir) {
  if (input.held.includes(dir)) return;
  if (!input.held.length) input.fresh = dir;
  input.held.push(dir);
  input.buffered = { dir, until: performance.now() + TURN_BUFFER_MS };
  state.blocked = false;
}

function release(dir) {
  const i = input.held.indexOf(dir);
  if (i !== -1) input.held.splice(i, 1);
}

addEventListener('keydown', e => {
  if (RESTART_KEYS.includes(e.key)) {
    if (!e.repeat) restartLevel();
    return;
  }
  const dir = KEY_TO_DIR[e.key];
  if (!dir) return;
  e.preventDefault();
  if (!e.repeat) press(dir);
});
addEventListener('keyup', e => {
  if (KEY_TO_DIR[e.key]) release(KEY_TO_DIR[e.key]);
});
addEventListener('blur', resetInput);

function restartLevel() {
  if (state.wonAt === null) startLevel(state.index);
}

// Directions currently held on any gamepad. Kept across resetInput() so a direction still
// held from the previous level is ignored until released, same as a held key.
const pad = { dirs: new Set(), restart: false };

function readPadDirs(gp) {
  const dirs = new Set();
  // Hysteresis keeps a jittery axis near the threshold from re-pressing every frame.
  const on = (dir, v) => v >= (pad.dirs.has(dir) ? PAD_RELEASE : PAD_PRESS);
  const [x = 0, y = 0] = gp.axes;
  if (on('left', -x)) dirs.add('left');
  if (on('right', x)) dirs.add('right');
  if (on('up', -y)) dirs.add('up');
  if (on('down', y)) dirs.add('down');
  if (gp.mapping === 'standard') {
    for (const [i, dir] of Object.entries(PAD_STANDARD_DPAD)) if (gp.buttons[i]?.pressed) dirs.add(dir);
  }
  return dirs;
}

function pollGamepads() {
  const dirs = new Set();
  let restart = false;
  for (const gp of navigator.getGamepads()) {
    if (!gp) continue;
    for (const dir of readPadDirs(gp)) dirs.add(dir);
    if (gp.buttons[PAD_RESTART_BUTTON]?.pressed) restart = true;
  }
  for (const dir of pad.dirs) if (!dirs.has(dir)) release(dir);
  for (const dir of dirs) if (!pad.dirs.has(dir)) press(dir);
  pad.dirs = dirs;
  if (restart && !pad.restart) restartLevel();
  pad.restart = restart;
}

function roverPos(now) {
  const t = Math.min(1, (now - state.moveStart) / state.moveMs);
  const { from, player } = state;
  return { x: from.x + (player.x - from.x) * t, y: from.y + (player.y - from.y) * t };
}

function stepMs() {
  return Math.max(MIN_STEP_MS, Math.min(MAX_STEP_MS, 120 + layout().cell * 0.45));
}

const isOpen = dir => !state.maze.cells[state.player.y][state.player.x][DIRS[dir].wall];

function move(dir, now) {
  const { dx, dy, angle } = DIRS[dir];
  const { x, y } = state.player;
  flushTrack();
  state.from = roverPos(now);
  state.player = { x: x + dx, y: y + dy };
  state.moveStart = now;
  state.moveMs = stepMs();
  state.targetAngle = angle;
  state.pendingTrack = { a: { x, y }, b: state.player };
}

function update(now, dt) {
  pollGamepads();
  const turn = state.targetAngle - state.angle;
  state.angle += Math.atan2(Math.sin(turn), Math.cos(turn)) * Math.min(1, dt / 60);
  if (now - state.moveStart >= state.moveMs) flushTrack();

  if (state.wonAt !== null) {
    resetInput();
    if (now - state.wonAt > WIN.next) startLevel(state.index + 1);
    return;
  }
  if (now < state.inputFrom) { resetInput(); return; }

  if (input.buffered && now > input.buffered.until) input.buffered = null;
  const isFresh = input.fresh !== null;
  // Finish the current step first: cutting it short would slide the rover diagonally past a corner.
  if (isFresh && now < state.moveStart + state.moveMs) return;
  if (!isFresh && (!input.held.length || now < state.nextMoveAt)) return;

  const wanted = [input.buffered?.dir, input.fresh, ...[...input.held].reverse()].filter(Boolean);
  input.fresh = null;
  state.nextMoveAt = now + (isFresh ? FIRST_REPEAT_MS : stepMs());

  const dir = wanted.find(isOpen);
  if (!dir) {
    state.targetAngle = DIRS[wanted[0]].angle;
    if (!state.blocked) state.bump = { dir: wanted[0], at: now };
    state.blocked = true;
    return;
  }
  state.blocked = false;
  if (dir === input.buffered?.dir) input.buffered = null;
  move(dir, now);

  if (state.player.x === state.goal.x && state.player.y === state.goal.y) state.wonAt = now + state.moveMs;
}

function layout() {
  const w = innerWidth, h = innerHeight;
  const header = h * 0.1;
  const margin = Math.min(w, h) * 0.05;
  const { cols, rows } = state.maze;
  const cell = Math.min((w - 2 * margin) / cols, (h - header - margin) / rows);
  const ox = (w - cell * cols) / 2;
  const oy = header + (h - header - margin - cell * rows) / 2;
  return { w, h, header, cell, ox, oy };
}

function buildMazeLayer() {
  mazeLayer.width = canvas.width;
  mazeLayer.height = canvas.height;
  const g = mazeLayer.getContext('2d');
  const dpr = devicePixelRatio || 1;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const { cell, ox, oy } = layout();
  const { cols, rows, cells } = state.maze;
  const p = state.planet;
  const wall = cell * WALL_RATIO;

  g.save();
  g.beginPath();
  g.roundRect(ox - wall / 2, oy - wall / 2, cell * cols + wall, cell * rows + wall, wall);
  g.fillStyle = p.floor;
  g.fill();
  g.clip();
  g.fillStyle = p.speck;
  for (const s of state.specks) {
    g.beginPath();
    g.arc(ox + s.x * cell, oy + s.y * cell, s.r * cell, 0, Math.PI * 2);
    g.fill();
  }
  for (const c of state.craters) {
    const x = ox + c.x * cell, y = oy + c.y * cell, r = c.r * cell;
    g.fillStyle = p.crater;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = p.craterRim;
    g.lineWidth = r * 0.25;
    g.beginPath();
    g.arc(x, y, r, Math.PI * 0.1, Math.PI * 0.9);
    g.stroke();
  }
  if (p.cracks) {
    g.strokeStyle = p.cracks;
    g.lineWidth = cell * 0.045;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (const crack of state.cracks) {
      g.beginPath();
      crack.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](ox + x * cell, oy + y * cell));
      g.stroke();
    }
  }
  for (const l of state.landmarks.filter(l => l.type === 'crater')) {
    drawBigCrater(g, ox + (l.x + 0.5) * cell, oy + (l.y + 0.5) * cell, cell * 0.4, p);
  }
  g.restore();

  const walls = new Path2D();
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = cells[y][x];
      const x0 = ox + x * cell, y0 = oy + y * cell, x1 = x0 + cell, y1 = y0 + cell;
      if (c.top) { walls.moveTo(x0, y0); walls.lineTo(x1, y0); }
      if (c.left) { walls.moveTo(x0, y0); walls.lineTo(x0, y1); }
      if (x === cols - 1 && c.right) { walls.moveTo(x1, y0); walls.lineTo(x1, y1); }
      if (y === rows - 1 && c.bottom) { walls.moveTo(x0, y1); walls.lineTo(x1, y1); }
    }
  }
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.save();
  g.translate(wall * 0.15, wall * 0.3);
  g.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  g.lineWidth = wall;
  g.stroke(walls);
  g.restore();
  g.strokeStyle = p.wallBase;
  g.lineWidth = wall;
  g.stroke(walls);
  g.save();
  g.translate(-wall * 0.06, -wall * 0.12);
  g.strokeStyle = p.wallTop;
  g.lineWidth = wall * 0.5;
  g.stroke(walls);
  g.restore();
}

function drawBigCrater(g, x, y, r, p) {
  const circle = (cx, cy, cr, fill) => {
    g.beginPath();
    g.arc(cx, cy, cr, 0, Math.PI * 2);
    g.fillStyle = fill;
    g.fill();
  };
  circle(x, y, r * 1.15, p.craterRim);
  g.save();
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  g.clip();
  circle(x, y, r, '#00000055');
  circle(x + r * 0.22, y + r * 0.22, r, p.crater);
  g.restore();
  circle(x + r * 0.1, y + r * 0.1, r * 0.14, p.craterRim);
}

function drawTrack(g, { a, b }, cell, ox, oy) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const along = cell * 0.07, across = cell * 0.13;
  const [w, h] = dx ? [along, across] : [across, along];
  for (let t = 0; t < 1; t += 0.2) {
    for (const side of [-0.3, 0.3]) {
      const x = ox + (a.x + 0.5 + dx * t - dy * side) * cell;
      const y = oy + (a.y + 0.5 + dy * t + dx * side) * cell;
      g.fillRect(x - w / 2, y - h / 2, w, h);
    }
  }
}

function trackLayerContext() {
  const g = trackLayer.getContext('2d');
  const dpr = devicePixelRatio || 1;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = state.planet.track;
  return g;
}

function buildTrackLayer() {
  trackLayer.width = canvas.width;
  trackLayer.height = canvas.height;
  const g = trackLayerContext();
  const { cell, ox, oy } = layout();
  for (const seg of state.tracks) drawTrack(g, seg, cell, ox, oy);
}

// Tracks are laid once the rover has left them behind, so they never appear ahead of it.
function flushTrack() {
  const seg = state.pendingTrack;
  if (!seg) return;
  state.pendingTrack = null;
  const [p, q] = [seg.a, seg.b].sort((m, n) => m.x - n.x || m.y - n.y);
  const key = `${p.x},${p.y}-${q.x},${q.y}`;
  if (state.trackKeys.has(key)) return;
  state.trackKeys.add(key);
  state.tracks.push(seg);
  const { cell, ox, oy } = layout();
  drawTrack(trackLayerContext(), seg, cell, ox, oy);
}

function box(cx, cy, w, h, r, fill, stroke = false) {
  ctx.beginPath();
  ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) ctx.stroke();
}

function dot(cx, cy, r, fill) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
}

function line(points, color, width) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const pt of points.slice(1)) ctx.lineTo(...pt);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

// Rovers are drawn in unit space facing +x, scaled to `size` pixels.
function withRoverSpace(cx, cy, angle, size, draw) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(size, size);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  draw();
  ctx.restore();
}

function drawLunokhod(cx, cy, angle, size) {
  withRoverSpace(cx, cy, angle, size, () => {
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    for (const x of [-0.33, -0.11, 0.11, 0.33]) {
      for (const y of [-0.4, 0.4]) box(x, y, 0.17, 0.13, 0.04, '#2b2d33', true);
    }
    box(0, 0, 0.84, 0.68, 0.14, '#d5d9e0', true);
    box(-0.12, 0, 0.52, 0.6, 0.05, '#2f6fd6', true);
    for (const x of [-0.25, -0.12, 0.01]) line([[x, -0.28], [x, 0.28]], '#8fb8ff', 0.015);
    for (const y of [-0.1, 0.1]) line([[-0.36, y], [0.12, y]], '#8fb8ff', 0.015);
    for (const y of [-0.16, 0.16]) dot(0.31, y, 0.06, '#ffd60a');
  });
}

function drawIcebreaker(cx, cy, angle, size) {
  withRoverSpace(cx, cy, angle, size, () => {
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    for (const y of [-0.36, 0.36]) {
      box(0, y, 0.88, 0.2, 0.09, '#2b2d33', true);
      for (let x = -0.36; x <= 0.36; x += 0.12) line([[x, y - 0.08], [x, y + 0.08]], '#5b5f6b', 0.03);
    }
    ctx.beginPath();
    ctx.moveTo(-0.32, -0.09);
    ctx.lineTo(-0.52, 0);
    ctx.lineTo(-0.32, 0.09);
    ctx.closePath();
    ctx.fillStyle = '#9aa1ad';
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    ctx.stroke();
    line([[-0.36, -0.07], [-0.4, 0.05]], OUTLINE, 0.02);
    line([[-0.42, -0.05], [-0.46, 0.03]], OUTLINE, 0.02);
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    box(-0.01, 0, 0.62, 0.52, 0.1, '#ff7a1a', true);
    box(0.17, 0, 0.16, 0.38, 0.05, '#1d3557', true);
    line([[0.12, -0.13], [0.12, -0.02]], '#8fb8ff', 0.025);
    dot(-0.12, 0, 0.06, '#ffd60a');
    for (const y of [-0.19, 0.19]) dot(0.29, y, 0.045, '#fff3b0');
  });
}

function drawMarsRover(cx, cy, angle, size) {
  withRoverSpace(cx, cy, angle, size, () => {
    for (const y of [-0.4, 0.4]) line([[-0.3, y], [0.3, y]], '#5a5650', 0.05);
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    for (const x of [-0.3, 0, 0.3]) {
      for (const y of [-0.4, 0.4]) {
        box(x, y, 0.2, 0.15, 0.05, '#33302c', true);
        dot(x, y, 0.035, '#9a958c');
      }
    }
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    box(-0.4, 0, 0.18, 0.2, 0.04, '#3b3b40', true);
    box(-0.02, 0, 0.6, 0.54, 0.05, '#ece6da', true);
    box(-0.06, 0.06, 0.34, 0.26, 0.03, '#c9bfae');
    line([[0.28, 0.12], [0.42, 0.12], [0.42, -0.02]], '#7a7670', 0.04);
    dot(0.42, -0.04, 0.05, '#5a5650');
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    box(0.14, -0.15, 0.16, 0.13, 0.03, '#fafafa', true);
    dot(0.22, -0.18, 0.025, '#1d4ed8');
    dot(0.22, -0.12, 0.025, '#1d4ed8');
  });
}

// Upright landmarks use the same side-view unit space as the rocket: base at y=0, top at y=-1.
function withUprightSpace(cx, baseY, size, draw) {
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(size, size);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  draw();
  ctx.restore();
}

function outlinedLine(points, color, width) {
  line(points, OUTLINE, width + 0.05);
  line(points, color, width);
}

function drawFlag(cx, baseY, size, now) {
  withUprightSpace(cx, baseY, size, () => {
    const wave = Math.sin(now / 250) * 0.04;
    outlinedLine([[0, 0], [0, -1]], '#e8eaef', 0.05);
    ctx.beginPath();
    ctx.moveTo(0.03, -0.98);
    ctx.quadraticCurveTo(0.3, -0.98 + wave, 0.6, -0.96);
    ctx.lineTo(0.6, -0.62);
    ctx.quadraticCurveTo(0.3, -0.64 + wave, 0.03, -0.62);
    ctx.closePath();
    ctx.fillStyle = '#ff8c42';
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    ctx.stroke();
    dot(0.3, -0.8 + wave / 2, 0.08, '#ffffff');
  });
}

function drawAntenna(cx, baseY, size, now) {
  withUprightSpace(cx, baseY, size, () => {
    outlinedLine([[-0.25, 0], [0, -0.45], [0.25, 0]], '#9aa1ad', 0.05);
    outlinedLine([[0, 0], [0, -0.55]], '#9aa1ad', 0.05);
    ctx.translate(0, -0.6);
    ctx.rotate(-0.5);
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.42, 0.18, 0, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = '#f1f3f6';
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 0.03;
    ctx.stroke();
    line([[0, 0.1], [0, -0.3]], OUTLINE, 0.03);
    dot(0, -0.32, 0.06, Math.floor(now / 600) % 2 ? '#ff3b30' : '#7a1d18');
  });
}

const UPRIGHT_LANDMARKS = { flag: drawFlag, antenna: drawAntenna };

function drawPad(cx, cy, cell, now) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, cell * 0.42, cell * 0.14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#2d2f38';
  ctx.fill();
  ctx.strokeStyle = `rgba(255, 214, 10, ${0.5 + 0.4 * Math.sin(now / 300)})`;
  ctx.lineWidth = cell * 0.04;
  ctx.stroke();
}

// Rocket stands upright (side view) in unit space: base at y=0, nose at y=-1.
function drawRocket(cx, baseY, size, flame, now) {
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(size, size);
  ctx.lineJoin = 'round';

  if (flame) {
    const len = 0.45 + 0.08 * Math.sin(now / 30);
    const g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, '#fff3b0');
    g.addColorStop(0.4, '#ffb703');
    g.addColorStop(1, 'rgba(230, 57, 70, 0)');
    ctx.beginPath();
    ctx.moveTo(-0.11, -0.02);
    ctx.quadraticCurveTo(0, len * 1.1, 0.11, -0.02);
    ctx.fillStyle = g;
    ctx.fill();
  }

  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 0.025;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 0.18, -0.38);
    ctx.lineTo(side * 0.36, -0.02);
    ctx.lineTo(side * 0.18, -0.1);
    ctx.closePath();
    ctx.fillStyle = '#e63946';
    ctx.fill();
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(-0.1, -0.1);
  ctx.lineTo(0.1, -0.1);
  ctx.lineTo(0.13, 0);
  ctx.lineTo(-0.13, 0);
  ctx.closePath();
  ctx.fillStyle = '#4a4d57';
  ctx.fill();
  ctx.stroke();

  const body = new Path2D();
  body.moveTo(-0.2, -0.1);
  body.lineTo(-0.2, -0.6);
  body.quadraticCurveTo(-0.2, -1, 0, -1);
  body.quadraticCurveTo(0.2, -1, 0.2, -0.6);
  body.lineTo(0.2, -0.1);
  body.closePath();
  const shade = ctx.createLinearGradient(-0.2, 0, 0.2, 0);
  shade.addColorStop(0, '#c4c8d0');
  shade.addColorStop(0.4, '#ffffff');
  shade.addColorStop(1, '#a9aeb8');
  ctx.fillStyle = shade;
  ctx.fill(body);
  ctx.save();
  ctx.clip(body);
  ctx.fillStyle = '#e63946';
  ctx.fillRect(-0.25, -1.05, 0.5, 0.27);
  ctx.restore();
  ctx.stroke(body);

  ctx.beginPath();
  ctx.arc(0, -0.5, 0.09, 0, Math.PI * 2);
  ctx.fillStyle = '#4cc9f0';
  ctx.fill();
  ctx.lineWidth = 0.035;
  ctx.stroke();

  ctx.restore();
}

function makeStars() {
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 3000) }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: 0.3 + Math.random() * 1.4,
    phase: Math.random() * Math.PI * 2,
  }));
}

function drawSky(now, w, h) {
  ctx.fillStyle = '#070a1f';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    ctx.globalAlpha = 0.5 + 0.45 * Math.sin(now / 700 + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawText(text, x, y, size, align, color) {
  ctx.font = `bold ${size}px ui-rounded, "SF Pro Rounded", system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.15;
  ctx.strokeStyle = '#070a1f';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

const clamp01 = v => Math.max(0, Math.min(1, v));

function render(now) {
  const { w, h, header, cell, ox, oy } = layout();
  const toPx = p => [ox + (p.x + 0.5) * cell, oy + (p.y + 0.5) * cell];
  const winT = state.wonAt === null ? null : now - state.wonAt;

  drawSky(now, w, h);
  ctx.drawImage(mazeLayer, 0, 0, w, h);
  ctx.drawImage(trackLayer, 0, 0, w, h);
  drawText(`${state.planet.name} — уровень ${state.index + 1}`, ox, header / 2, header * 0.45, 'left', '#ffffff');

  for (const l of state.landmarks) {
    const [lx, ly] = toPx(l);
    UPRIGHT_LANDMARKS[l.type]?.(lx, ly + cell * 0.3, cell * 0.75, now);
  }

  const [gx, gy] = toPx(state.goal);
  const padY = gy + cell * 0.32;
  drawPad(gx, padY, cell, now);

  const flame = winT !== null && winT >= WIN.ignite;
  const shake = flame && winT < WIN.lift ? (Math.random() - 0.5) * cell * 0.04 : 0;
  const liftT = winT === null ? 0 : clamp01((winT - WIN.lift) / WIN.liftMs);
  const lift = liftT * liftT * (padY + cell * 2);
  drawRocket(gx + shake, padY - lift, cell * 0.95, flame, now);

  const shrink = winT === null ? 1 : 1 - clamp01((winT - WIN.shrinkStart) / WIN.shrinkMs);
  if (shrink > 0) {
    const [rx, ry] = toPx(roverPos(now));
    const bumpT = state.bump ? (now - state.bump.at) / BUMP_MS : 1;
    const nudge = bumpT < 1 ? Math.sin(Math.PI * bumpT) * cell * 0.1 : 0;
    const { dx, dy } = state.bump ? DIRS[state.bump.dir] : DIRS.right;
    state.planet.drawRover(rx + dx * nudge, ry + dy * nudge, state.angle, cell * ROVER_RATIO * shrink);
  }

  if (winT !== null && winT >= WIN.lift) drawText('Ура!', w / 2, h / 2, h * 0.18, 'center', '#ffd60a');
}

function resizeCanvas() {
  const dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = `${innerWidth}px`;
  canvas.style.height = `${innerHeight}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeStars();
  if (state.maze) {
    buildMazeLayer();
    buildTrackLayer();
  }
}

// Shown instead of the game so a broken hand-edited level is obvious rather than a frozen screen.
let fatalError = null;

function drawError() {
  const w = innerWidth, h = innerHeight;
  ctx.fillStyle = '#070a1f';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ff6b6b';
  ctx.font = `bold ${Math.round(h * 0.035)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('Ошибка:', w * 0.05, h * 0.1);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(fatalError, w * 0.05, h * 0.17);
}

function fail(error) {
  console.error(error);
  fatalError = error.message;
}

function validateLevels() {
  if (typeof LEVELS === 'undefined' || !Array.isArray(LEVELS) || !LEVELS.length) {
    throw new Error('levels.js не загрузился или в нём ошибка (подробности в консоли)');
  }
  LEVELS.forEach((level, i) => parseLevel(level, i + 1, Object.keys(PLANETS)));
}

let lastFrameAt = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (fatalError === null) {
    try {
      update(now, now - lastFrameAt);
      render(now);
    } catch (error) {
      fail(error);
    }
  }
  if (fatalError !== null) drawError();
  lastFrameAt = now;
}

addEventListener('resize', resizeCanvas);
resizeCanvas();
try {
  validateLevels();
  startLevel(0);
} catch (error) {
  fail(error);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
